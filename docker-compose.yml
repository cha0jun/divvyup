services:
  # 1. THE TEST SERVICE
  tests:
    build: .
    container_name: app-tests
    # Overwrite the command to run pytest instead of starting the server
    command: python -m pytest
    # Mount the code so changes are reflected immediately
    volumes:
      - .:/app
    # Ensure tests don't restart automatically if they fail
    restart: "no"
    # (Optional) If your app code crashes on import without DB env vars,
    # keep these. If you use SQLite for tests, you might not need them.
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENV=TEST
  app: # Name of the service
    build: . # Build from the Dockerfile in the current directory
    depends_on:
      db:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=tcx2004
      - DB_NAME=app_db
      - DB_DRIVER=pymysql
      - SECRET_KEY=${SECRET_KEY}
      - ENV=PRD
    ports: # Map port 8000 on the host to port 8000 in the container
      - "443:443"
    volumes:
      - .:/app
      - app-volume:/app/data/images
  db:
    image: mysql:latest
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: tcx2004
      MYSQL_USER: app_user
      MYSQL_PASSWORD: tcx2004
      MYSQL_DATABASE: app_db
    ports:
      - 3306:3306
    volumes:
      - db-volume:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-volume:
  app-volume:
