{% extends "layout.html" %}

{% block title %}My Invitations{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <h1>My Invitations</h1>
            <p class="text-muted">Invitations from other users to join their groups.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-10 col-lg-8" id="invitationsContainer">
            <div id="loadingState" class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Loading your invitations...</p>
            </div>
            </div>
    </div>
</div>

<script src="{{ url_for('static', path='/js/invitations.js') }}"></script>
{% endblock %}
