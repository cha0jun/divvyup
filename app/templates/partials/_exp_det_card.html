<div class="justify-content-center">
    <!-- Main Expense Card -->
    <div class="card border-0 shadow-sm">                
    <!-- == Dark Header Section == -->
    <div class="card-header bg-dark text-white p-4 position-relative">
        <div class="d-flex align-items-center">
            <span class="badge rounded-pill text-bg-light bg-opacity-25 fw-normal d-inline-flex align-items-center gap-2">
                <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="4" cy="4" r="4" fill="#63b3ed"/></svg>
                    Unsettled
            </span>
        </div>
        <h1 class="display-4 fw-bold my-2" id="modal-amt"></h1>
        </div>
        <!-- == Main Content Body == -->
        <div class="card-body p-4">
            <!-- Title Section -->
            <div class="pb-4 mb-4 border-bottom">
                <h2 class="h5 fw-bold mb-1" id="modal-name"></h2>
                <p class="text-muted mb-1" id="modal-desc"></p>
                <div class="fw-light">
                <div class="mb-2 gap-2 d-flex justify-content-between">
                    <div>
                        <span class="text-muted">Paid by:</span>
                        <span id="modal-payer" class="fw-medium"></span>
                    </div>
                    <div>
                        <span class="text-muted">Paid on:</span>
                        <span id="modal-paid-on" class="fw-medium"></span>
                    </div>
                </div>
            </div>
            </div>
            <!-- Breakdown Section -->
             <div class="pb-4 mb-4 border-bottom">
                <h6 class="text-muted text-uppercase small mb-3">Breakdown</h6>
                    <ul class="list-unstyled mb-0" id="modal-bdlist">
                    </ul>
            </div>          
            <!-- Receipt Section -->
            <div class="mb-4 pb-4 border-bottom" id="receiptSection">
                <h6 class="text-muted text-uppercase small mb-3">Receipt</h6>
                <div class="d-flex align-items-center justify-content-between p-3 border rounded" style="border-left: 5px solid #6c757d !important;">
                    
                    <div class="d-flex align-items-center text-secondary">
                        <i class="bi bi-paperclip fs-4 me-2"></i>
                        <span class="fw-medium">1 Attachment</span>
                    </div>

                    <a href="#" class="btn btn-sm btn-outline-secondary" id="modal-download">
                            <i class="bi bi-download me-1"></i> Download
                    </a>
                </div>
            </div>
            <!-- == NEW: Recurring Section (Hidden by default) == -->
            <div id="modal-recurring-section" class="d-none pb-4 mb-4 border-bottom">
                <h6 class="text-primary text-uppercase small mb-3">
                    <i class="bi bi-arrow-repeat me-1"></i> Recurring Schedule
                </h6>
                <div class="bg-light rounded p-3">
                    <div class="row g-3">
                        <div class="col-4 border-end">
                            <span class="d-block text-muted small" style="font-size: 0.75rem;">Frequency</span>
                            <span class="fw-semibold text-capitalize text-dark" id="modal-rec-freq"></span>
                        </div>
                        <div class="col-4 border-end">
                            <span class="d-block text-muted small" style="font-size: 0.75rem;">Start Date</span>
                            <span class="fw-medium text-dark" id="modal-rec-start"></span>
                        </div>
                        <div class="col-4">
                            <span class="d-block text-muted small" style="font-size: 0.75rem;">End Date</span>
                            <span class="fw-medium text-dark" id="modal-rec-end"></span>
                        </div>
                    </div>
                </div>
            </div>

    </div>
    <!-- == Footer Buttons == -->
    <div class="card-footer bg-white p-3 text-end">
        <button class="btn btn-dark" id="modal-edit">
            <i class="bi bi-pencil-fill me-1"></i> Edit Expense
        </button>
    </div>
</div>
</div>
</div>
