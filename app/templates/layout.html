    
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Default title, can be overridden by child templates -->
    <title>{% block title %}DivvyUp{% endblock %}</title>
</head>
<body>

    <!-- Common Navigation Bar -->
     {% include 'partials/_navbar.html' %}
    <!-- Main content area for each page -->
    <main class="container py-5">
        {% block content %}
        <!-- Child template content will be injected here -->
        {% endblock %}
    </main>

    <!-- Common Footer -->
<footer class="py-4 border-top">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <div class="col-md-4 d-flex align-items-center">
                <span class="mb-3 mb-md-0 text-muted">&copy; 2025 DivvyUp, Inc</span>
            </div>
            <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                <li class="ms-3"><a class="text-muted" href="#"><i class="bi bi-twitter"></i></a></li>
                <li class="ms-3"><a class="text-muted" href="#"><i class="bi bi-instagram"></i></a></li>
                <li class="ms-3"><a class="text-muted" href="#"><i class="bi bi-facebook"></i></a></li>
            </ul>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logoutButton = document.getElementById('logout-button');

            // Only add the click listener if the logout button exists on the page
            if (logoutButton) {
                logoutButton.addEventListener('click', async function() {
                    try {
                        // Call your /logout endpoint
                        await fetch('/logout', { method: 'POST' });
                    } catch (error) {
                        console.error('Logout failed:', error);
                    } finally {
                        // Always redirect to login after attempt
                        window.location.href = '/login';
                    }
                });
            }
        });
    </script>
</body>
</html>
