    
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
    
    <!-- Default title, can be overridden by child templates -->
    <title>{% block title %}DivvyUp{% endblock %}</title>
</head>
<body>

    <!-- Common Navigation Bar -->
     {% include 'partials/_navbar.html' %}
    <!-- Main content area for each page -->
    <main class="container mt-4">
        {% block content %}
        <!-- Child template content will be injected here -->
        {% endblock %}
    </main>

    <!-- Common Footer -->
    <footer class="text-center mt-5">
        <p>&copy; 2025 DivvyUp</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logoutButton = document.getElementById('logout-button');

            // Only add the click listener if the logout button exists on the page
            if (logoutButton) {
                logoutButton.addEventListener('click', async function() {
                    try {
                        // Call your /logout endpoint
                        await fetch('/logout', { method: 'POST' });
                    } catch (error) {
                        console.error('Logout failed:', error);
                    } finally {
                        // Always redirect to login after attempt
                        window.location.href = '/login';
                    }
                });
            }
        });
    </script>
</body>
</html>
